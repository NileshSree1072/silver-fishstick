spring.application.name=helpdesk-backend
spring.config.import=optional:file:.env[.properties]
# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk?options=-c%20TimeZone=UTC}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

app.openai.api-key=${OPENAI_API_KEY}
app.openai.embedding-model=text-embedding-3-small
app.openai.chat-model=gpt-4o-mini
app.openai.similarity-threshold=0.40
app.openai.max-tokens=300

# Azure OpenAI Configuration
app.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}
app.azure.openai.api-key=${AZURE_OPENAI_API_KEY}
app.azure.openai.embedding-deployment=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
app.azure.openai.api-version=${AZURE_OPENAI_API_VERSION}

# Groq Configuration
app.groq.api-key=${GROQ_API_KEY}
app.groq.chat-model=${GROQ_CHAT_MODEL}
app.groq.base-url=${GROQ_BASE_URL}

app.ai.bot-user-id=a3454d31-5a64-4bb0-91ea-27cfbe64521d

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
app.azure.storage.container-name=attachments

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=apk.school.bolt@gmail.com
spring.mail.password=wpkbgjsbhpphoxcq
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

