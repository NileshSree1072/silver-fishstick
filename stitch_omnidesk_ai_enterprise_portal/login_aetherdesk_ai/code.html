<style>
        .geometric-bg {
            background-color: #0b1326;
            background-image: radial-gradient(circle at 50% 50%, rgba(79, 70, 229, 0.05) 0%, transparent 50%),

            background-position: center, -1px -1px, -1px -1px;
        }
        
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            pointer-events: none;
        }

        .glass-card {
            background: linear-gradient(180deg, rgba(23, 31, 51, 0.9) 0%, rgba(11, 19, 38, 0.95) 100%);

<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden geometric-bg font-body-md">
<!-- Ambient Background Glows -->
<div class="ambient-glow bg-primary w-[500px] h-[500px] top-[-20%] left-[-10%]"></div>
<div class="ambient-glow bg-secondary-container w-[400px] h-[400px] bottom-[-10%] right-[-10%] opacity-20"></div>
<main class="relative z-10 w-full max-w-[440px] px-lg py-xl">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-xl">
<div class="w-12 h-12 bg-surface-container-high rounded-xl border border-outline-variant flex items-center justify-center mb-md shadow-lg shadow-black/20">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary mb-xs tracking-tight">AetherDesk AI</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enterprise Support Platform</p>
</div>
<!-- Login Card -->
<div class="glass-card border border-outline-variant rounded-xl p-xl transition-all duration-300 hover:border-outline/50">
<div class="mb-lg">
<h2 class="font-title-md text-title-md text-on-surface mb-xs">Sign in to your account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access the workspace.</p>
</div>
<form action="#" class="space-y-md" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="email">Work Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[18px]">mail</span>
</div>
<input class="block w-full pl-xl pr-md py-[10px] bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface-container transition-all" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[18px]">lock</span>
</div>
<input class="block w-full pl-xl pr-[40px] py-[10px] bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface-container transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full mt-lg bg-primary-container text-on-primary-container font-label-sm text-label-sm font-semibold py-[12px] px-md rounded-lg shadow-[inset_0_1px_0_rgba(255,255,255,0.15)] hover:bg-[#5a52f0] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface active:scale-[0.98] transition-all flex items-center justify-center gap-sm group" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-lg">
<div class="flex-grow border-t border-outline-variant/50"></div>
<span class="flex-shrink-0 mx-md font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/50"></div>
</div>
<!-- Social Auth Options -->
<div class="space-y-sm">
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-label-sm text-label-sm font-medium py-[10px] px-md rounded-lg hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-outline transition-colors flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined text-[20px]">key</span>
                    Sign in with SSO
                </button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-label-sm text-label-sm font-medium py-[10px] px-md rounded-lg hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-outline transition-colors flex items-center justify-center gap-sm" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                    Google
                </button>
</div>
</div>
<!-- Footer Links -->
<p class="text-center mt-lg font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="text-primary font-medium hover:text-primary-fixed transition-colors underline-offset-4 hover:underline" href="#">Request access</a>
</p>
</main>
<script>
        // Simple script to toggle password visibility
        const passwordInput = document.getElementById('password');
        const toggleBtn = passwordInput.nextElementSibling;
        const toggleIcon = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        });
    </script>
</body></html>
